# The linter's rules, written out so a new release of Ruff cannot change them on its own.
# The version is pinned in requirements-dev.txt. Widen the rules one group at a time, on purpose.
target-version = "py313"

# .scratch/ holds records, not code.
extend-exclude = [".scratch"]

[lint]
select = ["E4", "E7", "E9", "F", "RUF100"]
